# Build and publish the crab-exoskeleton-webapp (chat-webapp) image to GHCR.
#
# This is a Next.js BFF (output: "standalone"): it talks to mycelium only
# server-side, over MYCELIUM_INTERNAL_URL read at RUNTIME, and DATABASE_URL at
# runtime too. Nothing deploy-specific is baked at build time, so one published
# image is portable across every deployment/domain (unlike the Vite SPA, whose
# API URL is compiled in).
name: release-image

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
